# nginx serving the built SPA (frontend/Dockerfile, runtime stage). Like the
# `serve -s dist` it replaces, it sets no security headers of its own: those
# come from the reverse proxy (deploy/reverse-proxy/), which also routes /api
# and /mcp to the backend.
server_tokens off;

server {
    listen 4173;
    root /usr/share/nginx/html;
    index index.html;
    charset utf-8;
    absolute_redirect off;

    gzip on;
    gzip_vary on;
    gzip_types text/css application/javascript application/json image/svg+xml text/plain;

    # Vite names every bundle after its content hash, so it can be kept for good.
    location /assets/ {
        add_header Cache-Control "public, max-age=31536000, immutable" always;
        try_files $uri =404;
    }

    # Client-side routes (/scans/targets/<encoded url>, /vulnerability/<id>, …)
    # fall back to index.html, which the browser revalidates so a new image
    # shows at once.
    location / {
        add_header Cache-Control "no-cache" always;
        try_files $uri /index.html;
    }
}
