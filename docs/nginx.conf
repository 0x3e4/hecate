# nginx serving the documentation site (docs/Dockerfile). The
# Content-Security-Policy lets the pages load nothing from elsewhere.
server_tokens off;

server {
    listen 80;
    root /usr/share/nginx/html;
    index index.html;
    charset utf-8;
    # /guide/search redirects to /guide/search/ with a relative Location, so it
    # also works behind a proxy that serves the site under a path.
    absolute_redirect off;

    # Pages and unhashed assets (assets/extra.css, the fonts, screenshots)
    # keep their names across builds, so the browser revalidates them on every
    # load (a cheap 304 through the ETag) and a new image shows at once.
    add_header Cache-Control "no-cache" always;
    add_header Content-Security-Policy "default-src 'self'; img-src 'self' data:; style-src 'self' 'unsafe-inline'; script-src 'self' 'unsafe-inline'; font-src 'self'; connect-src 'self'; frame-ancestors 'none'; base-uri 'self'; form-action 'none'" always;
    add_header X-Content-Type-Options nosniff always;
    add_header Referrer-Policy no-referrer always;

    # Material's bundles carry a content hash in their name, so they can be
    # kept for good. nginx drops inherited add_header lines once a block sets
    # its own, so the security headers are repeated here.
    # Quoted: nginx reads an unquoted { as the start of the block.
    location ~ "^/assets/(stylesheets|javascripts)/.+\.[0-9a-f]{8}\.min\.(css|js)$" {
        add_header Cache-Control "public, max-age=31536000, immutable" always;
        add_header Content-Security-Policy "default-src 'self'; img-src 'self' data:; style-src 'self' 'unsafe-inline'; script-src 'self' 'unsafe-inline'; font-src 'self'; connect-src 'self'; frame-ancestors 'none'; base-uri 'self'; form-action 'none'" always;
        add_header X-Content-Type-Options nosniff always;
        add_header Referrer-Policy no-referrer always;
    }

    error_page 404 /404.html;
}
