name: Build and Push Container Images

on:
  push:
    branches:
      - main
    tags:
      - '[0-9]+.[0-9]+.[0-9]+*'
  workflow_dispatch:

env:
  REGISTRY: ghcr.io
  OWNER: ${{ github.repository_owner }}

jobs:
  # ── Quality gate ──────────────────────────────────────────────────────────
  # These run before the build matrix and BLOCK it (build `needs:` all three),
  # so a red lint/type/test check stops `latest` / `main-<sha>` from shipping to
  # GHCR. Previously the images built and pushed with zero verification.
  backend-test:
    name: Backend (ruff + pytest)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: ./backend
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-python@v5
        with:
          python-version: "3.14"
      - name: Install Poetry
        run: pipx install poetry
      - name: Install dependencies
        run: poetry install --no-interaction --no-root
      - name: Ruff
        run: poetry run ruff check .
      - name: Pytest
        run: poetry run pytest -q

  scanner-test:
    name: Scanner (pytest)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: ./scanner
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-python@v5
        with:
          python-version: "3.14"
      - name: Install Poetry
        run: pipx install poetry
      - name: Install dependencies
        run: poetry install --no-interaction --no-root
      # Test tooling is intentionally NOT in the runtime image (Dockerfile uses
      # --only main); install it into the Poetry venv just for CI.
      - name: Install test tooling
        run: poetry run pip install pytest pytest-asyncio httpx
      - name: Pytest
        run: poetry run pytest -q

  frontend-test:
    name: Frontend (lint + typecheck + test + build)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: ./frontend
    steps:
      - uses: actions/checkout@v6
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "24"
          cache: pnpm
          cache-dependency-path: frontend/pnpm-lock.yaml
      - name: Install dependencies
        run: pnpm install --frozen-lockfile
      - name: Lint
        run: pnpm lint
      - name: Type-check
        run: pnpm typecheck
      - name: Unit tests
        run: pnpm test
      - name: Build
        run: pnpm build

  build:
    name: Build and Push (${{ matrix.component }})
    runs-on: ubuntu-latest
    needs: [backend-test, scanner-test, frontend-test]
    permissions:
      contents: read
      packages: write
    strategy:
      fail-fast: false
      matrix:
        include:
          - component: backend
            context: ./backend
            target: ""
            title: Hecate Backend
            description: FastAPI backend — REST API, scheduler, MCP server, and 9 ingestion pipelines (NVD / EUVD / KEV / CWE / CAPEC / CPE / CIRCL / GHSA / OSV).
          - component: frontend
            context: ./frontend
            target: runtime
            title: Hecate Frontend
            description: React SPA — vulnerability dashboard, DQL query builder, SCA scan management, environment inventory, MCP info, served by nginx.
          - component: scanner
            context: ./scanner
            target: ""
            title: Hecate Scanner
            description: Scanner sidecar — Trivy, Grype, Syft, OSV Scanner, Semgrep, TruffleHog, Dockle, Dive, DevSkim plus the Hecate analyzer (35 supply-chain rules).
    steps:
      - name: Checkout repository
        uses: actions/checkout@v6

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v4

      - name: Login to GitHub Container Registry
        uses: docker/login-action@v4
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Extract metadata
        id: meta
        uses: docker/metadata-action@v6
        with:
          images: ${{ env.REGISTRY }}/${{ env.OWNER }}/hecate-${{ matrix.component }}
          tags: |
            type=ref,event=branch
            type=sha,prefix={{branch}}-,enable={{is_default_branch}}
            type=raw,value=latest,enable={{is_default_branch}}
            type=semver,pattern={{version}}
            type=semver,pattern={{major}}.{{minor}}
            type=semver,pattern={{major}}
          labels: |
            org.opencontainers.image.title=${{ matrix.title }}
            org.opencontainers.image.description=${{ matrix.description }}

      - name: Build and push
        uses: docker/build-push-action@v7
        with:
          context: ${{ matrix.context }}
          target: ${{ matrix.target }}
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          # Inject the short commit SHA so the running container can
          # report its identity via /api/v1/version. Used by the in-app
          # Support page to detect when a newer `main-<sha>` image has
          # been pushed to GHCR.
          build-args: |
            HECATE_BUILD_SHA=${{ github.sha }}
          cache-from: type=gha,scope=${{ matrix.component }}
          cache-to: type=gha,mode=max,scope=${{ matrix.component }}
