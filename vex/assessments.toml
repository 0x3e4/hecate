# ------------------------------------------------------------------ scanner: Semgrep venv, DevSkim

[[statement]]
images = ["scanner"]
packages = ["mcp"]
status = "not_affected"
justification = "vulnerable_code_not_in_execute_path"
impact = "mcp is a dependency of Semgrep's MCP server (`semgrep mcp`). The sidecar only runs `semgrep scan` (scanner/app/scanners.py), which does not start the MCP client or server code."
reviewed = 2026-11-05

[[statement]]
images = ["scanner"]
packages = ["opentelemetry-api"]
status = "not_affected"
justification = "vulnerable_code_not_in_execute_path"
impact = "The flaw is in parsing W3C tracestate headers. Semgrep only traces with --trace, which the sidecar does not pass (metrics are off via SEMGREP_SEND_METRICS=off), and it receives no incoming trace context."
reviewed = 2026-11-05

[[statement]]
images = ["scanner"]
packages = ["SharpCompress", "sharpcompress"]
status = "not_affected"
justification = "vulnerable_code_not_in_execute_path"
impact = "SharpCompress is only used when DevSkim extracts archives (--crawl-archives). The sidecar runs `devskim analyze` without that option (scanner/app/scanners.py), so DevSkim never extracts an archive."
reviewed = 2026-11-05

[[statement]]
images = ["scanner"]
packages = ["wcmatch"]
vulnerabilities = ["CVE-2026-132276"]
status = "affected"
action = "wcmatch is in the scanner as a dependency of Semgrep, which matches every file path of the scanned tree against its ignore and include globs. A repository can name files so that one comparison backtracks for a long time (CPU denial of service, no code execution). Semgrep runs as its own process under SEMGREP_TIMEOUT_SECONDS (scanner/app/scanners.py), so a hostile tree costs at most that scan's Semgrep result. Fixed in wcmatch 11.2, which arrives when Semgrep allows it."
reviewed = 2026-11-26

