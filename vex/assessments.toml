# ------------------------------------------------------------------ source repository

[[statement]]
images = ["source"]
packages = ["minimatch"]
status = "not_affected"
justification = "vulnerable_code_not_in_execute_path"
impact = "minimatch 10 is only a dependency of the ESLint toolchain (frontend devDependencies). It runs on the maintainers' and CI's own lint configuration and never ships: the frontend image contains only the built static files."
reviewed = 2026-11-05

[[statement]]
images = ["source"]
packages = ["katex"]
vulnerabilities = ["GHSA-238p-pmpm-9mq7"]
status = "not_affected"
justification = "vulnerable_code_cannot_be_controlled_by_adversary"
impact = "KaTeX comes with mermaid 11 into the lazily loaded diagram chunk. The flaw lets an already existing prototype pollution switch on KaTeX's `trust` option; mermaid renders with `trust` off and the frontend has no known prototype-pollution flaw, so there is nothing to build on. KaTeX 0.18.2 arrives with mermaid 12."
reviewed = 2026-11-05

# ------------------------------------------------------------------ scanner: Go modules

[[statement]]
images = ["scanner"]
packages = ["github.com/docker/docker"]
vulnerabilities = [
  "CVE-2026-33997", "CVE-2026-34040", "CVE-2026-41567", "CVE-2026-41568", "CVE-2026-42306",
  "GO-2026-4883", "GO-2026-4887", "GO-2026-5617", "GO-2026-5668", "GO-2026-5746",
]
status = "not_affected"
justification = "vulnerable_code_not_in_execute_path"
impact = "govulncheck finds the vulnerable functions in dive, dockle and grype, but they are methods of the Docker daemon's own `daemon.Daemon` (docker cp, plugin privileges, container filesystem), which only dockerd creates. The three tools use Docker's client and image types; the sidecar runs no Docker daemon and has no Docker socket."
reviewed = 2026-11-05

[[statement]]
images = ["scanner"]
packages = ["golang.org/x/crypto"]
vulnerabilities = ["GO-2026-5932"]
locations = ["/usr/local/bin/skopeo"]
status = "not_affected"
justification = "vulnerable_code_not_in_execute_path"
impact = "GO-2026-5932 marks the whole golang.org/x/crypto/openpgp package as unmaintained and unsafe by design. skopeo is built with containers_image_openpgp (scanner/Dockerfile), so the package serves signature verification only, and that never runs: the signature policy is insecureAcceptAnything and the sidecar never asks skopeo to sign or verify (only `inspect` and `copy`)."
reviewed = 2026-11-05

[[statement]]
images = ["scanner"]
packages = ["golang.org/x/crypto"]
vulnerabilities = ["GO-2026-5932"]
status = "under_investigation"
notes = "GO-2026-5932 is not a single flaw: it marks the whole golang.org/x/crypto/openpgp package as unmaintained and unsafe by design. govulncheck finds the package in this upstream binary; which of its code paths use it (most likely go-git's commit-signature support) is not established yet. It goes away when the upstream project moves to a maintained OpenPGP library."
reviewed = 2026-11-05
