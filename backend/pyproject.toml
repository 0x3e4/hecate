[tool.poetry]
name = "hecate-backend"
version = "1.5.0"
description = "FastAPI backend for the Hecate cyber defense platform."
authors = ["Hecate Team <info@hecate.pw>"]
readme = "README.md"
packages = [{ include = "app" }]

[tool.poetry.dependencies]
python = "^3.13"
fastapi = "0.128.5"
uvicorn = "0.40.0"
pydantic = "^2.12"
pydantic-settings = "^2.11.0"
motor = "^3.7"
opensearch-py = "^3.0.0"
httpx = "^0.28.1"
structlog = "^25.5.0"
python-dateutil = "^2.9.0"
apscheduler = "^3.11.1"
google-genai = "^1.49.0"
starlette = "0.52.1"
opensearch-protobufs = "1.2.0"
mcp = {version = "^1.9", extras = ["cli"]}

[tool.poetry.group.dev.dependencies]
pytest = "9.0.2"
pytest-asyncio = "^1.2.0"
ruff = "0.15.0"
pytest-cov = "^7.0.0"

[build-system]
requires = ["poetry-core"]
build-backend = "poetry.core.masonry.api"

[tool.pytest.ini_options]
# auto mode marks every `async def test_*` without needing an explicit
# @pytest.mark.asyncio, so a forgotten marker can't silently no-op as a false
# green (pytest-asyncio 1.x defaults to strict).
asyncio_mode = "auto"
testpaths = ["tests"]
pythonpath = ["."]

[tool.ruff]
# First pinned ruff config over a large, never-linted codebase. Scoped to the
# pyflakes real-bug family ("F") for the first gate — deliberately NOT enabling
# import-sort (I) / style (E) / pyupgrade (UP) yet, so this gate stays green on
# day one and the mechanical reformat churn doesn't bury real changes. Widen the
# `select` in dedicated follow-ups.
target-version = "py313"
line-length = 120

[tool.ruff.lint]
select = ["F"]
